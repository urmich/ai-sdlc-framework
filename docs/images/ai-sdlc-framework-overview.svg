<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI SDLC Framework lifecycle</title>
  <desc id="desc">A provider-neutral lifecycle that moves from outcome definition through implementation and evidence-based release readiness, with human decisions at consequential boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#1864ab"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#e67700"/>
    </marker>
    <style>
      .title { font: 700 48px Inter, Arial, sans-serif; fill: #16191d; text-anchor: middle; }
      .subtitle { font: 600 24px Inter, Arial, sans-serif; fill: #364152; text-anchor: middle; }
      .section { font: 700 22px Inter, Arial, sans-serif; fill: #364152; letter-spacing: 2px; }
      .box-title { font: 700 25px Inter, Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .box-copy { font: 18px Inter, Arial, sans-serif; fill: #364152; text-anchor: middle; }
      .gate { font: 700 14px Inter, Arial, sans-serif; fill: #9c4a00; text-anchor: middle; letter-spacing: 1px; }
      .outcome { font: 700 29px Inter, Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .support { font: 18px Inter, Arial, sans-serif; fill: #364152; text-anchor: middle; }
      .footer { font: 600 17px Inter, Arial, sans-serif; fill: #495057; text-anchor: middle; }
      .define { fill: #d0ebff; stroke: #1971c2; stroke-width: 3; }
      .test { fill: #e5dbff; stroke: #7048e8; stroke-width: 3; }
      .build { fill: #d3f9d8; stroke: #2b8a3e; stroke-width: 3; }
      .release { fill: #fff3bf; stroke: #e67700; stroke-width: 3; }
      .neutral { fill: #ffffff; stroke: #adb5bd; stroke-width: 2; }
      .decision { fill: #fff4e6; stroke: #f08c00; stroke-width: 2; }
      .blue-line { fill: none; stroke: #1864ab; stroke-width: 4; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #2b8a3e; stroke-width: 4; marker-end: url(#arrow-green); }
      .orange-line { fill: none; stroke: #e67700; stroke-width: 4; marker-end: url(#arrow-orange); }
      .loop { fill: none; stroke: #2b8a3e; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#background)"/>
  <circle cx="1690" cy="55" r="190" fill="#dbe4ff" opacity="0.55"/>
  <circle cx="80" cy="1035" r="190" fill="#e5dbff" opacity="0.45"/>

  <text x="900" y="70" class="title">AI SDLC Framework</text>
  <text x="900" y="112" class="subtitle">Reduce solution-first bias by validating outcomes before investing in implementation</text>

  <text x="95" y="190" class="section">1  DISCOVER AND DEFINE</text>
  <text x="700" y="190" class="section">2  IMPLEMENT AND VERIFY</text>
  <text x="1315" y="190" class="section">3  RELEASE WITH EVIDENCE</text>

  <rect x="95" y="235" width="500" height="120" rx="22" class="define"/>
  <text x="345" y="282" class="box-title">Requirements + acceptance criteria</text>
  <text x="345" y="320" class="box-copy">Clarify intent, constraints, assumptions, and observable success</text>

  <rect x="242" y="370" width="206" height="38" rx="19" class="decision"/>
  <text x="345" y="395" class="gate">HUMAN DECISION</text>

  <rect x="95" y="425" width="500" height="120" rx="22" class="test"/>
  <text x="345" y="472" class="box-title">Test strategy + living evidence plan</text>
  <text x="345" y="510" class="box-copy">Map every acceptance criterion to proof and failure conditions</text>

  <rect x="242" y="560" width="206" height="38" rx="19" class="decision"/>
  <text x="345" y="585" class="gate">HUMAN DECISION</text>

  <rect x="95" y="615" width="500" height="120" rx="22" class="define"/>
  <text x="345" y="662" class="box-title">Technical design</text>
  <text x="345" y="700" class="box-copy">Select architecture only after outcomes and evidence are clear</text>

  <rect x="242" y="750" width="206" height="38" rx="19" class="decision"/>
  <text x="345" y="775" class="gate">HUMAN DECISION</text>

  <path d="M345 355 L345 370" class="blue-line"/>
  <path d="M345 408 L345 425" class="blue-line"/>
  <path d="M345 545 L345 560" class="blue-line"/>
  <path d="M345 598 L345 615" class="blue-line"/>
  <path d="M345 735 L345 750" class="blue-line"/>

  <rect x="700" y="300" width="500" height="140" rx="22" class="build"/>
  <text x="950" y="354" class="box-title">Incremental implementation</text>
  <text x="950" y="394" class="box-copy">Build against approved intent and preserve traceability</text>

  <rect x="700" y="545" width="500" height="140" rx="22" class="build"/>
  <text x="950" y="599" class="box-title">Unit-first local verification</text>
  <text x="950" y="639" class="box-copy">Every correction starts a fresh, candidate-bound evidence cycle</text>

  <rect x="780" y="720" width="340" height="95" rx="22" class="neutral"/>
  <text x="950" y="758" class="box-title">Independent candidate review</text>
  <text x="950" y="790" class="box-copy">Review the exact validated change set</text>

  <path d="M950 440 L950 545" class="green-line"/>
  <path d="M950 685 L950 720" class="green-line"/>
  <path d="M710 600 C645 600 645 370 700 370" class="loop"/>
  <text x="645" y="500" class="box-copy" transform="rotate(-90 645 500)">fix, learn, and revalidate</text>
  <path d="M1120 767 C1240 767 1240 370 1200 370" class="loop"/>
  <text x="1250" y="565" class="box-copy" transform="rotate(90 1250 565)">review finding: update and revalidate</text>

  <path d="M448 769 L650 769 L650 370 L700 370" class="blue-line"/>

  <rect x="1320" y="235" width="405" height="120" rx="22" class="release"/>
  <text x="1522" y="282" class="box-title">Development validation</text>
  <text x="1522" y="320" class="box-copy">Build, deploy, and test with explicit authorization</text>

  <rect x="1419" y="370" width="206" height="38" rx="19" class="decision"/>
  <text x="1522" y="395" class="gate">HUMAN DECISION</text>

  <rect x="1320" y="425" width="405" height="120" rx="22" class="release"/>
  <text x="1522" y="472" class="box-title">Pre-production validation</text>
  <text x="1522" y="510" class="box-copy">Policy-selected owner, environment, and evidence</text>

  <rect x="1419" y="560" width="206" height="38" rx="19" class="decision"/>
  <text x="1522" y="585" class="gate">HUMAN DECISION</text>

  <rect x="1320" y="615" width="405" height="120" rx="22" class="build"/>
  <text x="1522" y="662" class="box-title">Release readiness</text>
  <text x="1522" y="700" class="box-copy">Current review, automation, policy, and artifact evidence</text>

  <path d="M1522 355 L1522 370" class="orange-line"/>
  <path d="M1522 408 L1522 425" class="orange-line"/>
  <path d="M1522 545 L1522 560" class="orange-line"/>
  <path d="M1522 598 L1522 615" class="green-line"/>
  <path d="M1120 767 L1275 767 L1275 295 L1320 295" class="orange-line"/>

  <rect x="95" y="865" width="1630" height="135" rx="26" class="neutral"/>
  <text x="910" y="913" class="outcome">Less assumption-driven bias  →  fewer avoidable failures  →  less rework  →  higher delivery confidence</text>
  <text x="910" y="956" class="support">Recoverable state  •  End-to-end traceability  •  Version-control audit trail  •  Verified automation evidence</text>

  <text x="900" y="1045" class="footer">Human authority at consequential boundaries  •  Provider-neutral adapters  •  Explicit, auditable overrides</text>
</svg>
