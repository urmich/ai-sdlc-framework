name: Release acceptance

on:
  workflow_call:
    inputs:
      acceptance_handoff:
        type: string
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: source
    shell: bash

jobs:
  anonymous-acceptance:
    name: consumer-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_BUNDLE_SHA256: ${{ fromJSON(inputs.acceptance_handoff).bundle.sha256 }}
      EXPECTED_SOURCE_COMMIT: ${{ fromJSON(inputs.acceptance_handoff).identity.sourceCommit }}
      RELEASE_INTENT_ID: ${{ fromJSON(inputs.acceptance_handoff).releaseIntentId }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reject a misbound acceptance source before checkout
        working-directory: .
        run: test "$GITHUB_EVENT_NAME" = workflow_dispatch && test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ fromJSON(inputs.acceptance_handoff).identity.sourceCommit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.architecture }}
      - name: Provision exact native tools and owned Homebrew prefix without global linking
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: node scripts/native-toolchain.mjs --target "$NATIVE_TARGET" --output-dir .test-data/consumer-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ fromJSON(inputs.acceptance_handoff).bundle.artifactId }}
          run-id: ${{ fromJSON(inputs.acceptance_handoff).bundle.sourceRunId }}
          github-token: ${{ github.token }}
          path: source/.test-data/release-bundle
          merge-multiple: true
      - name: Anonymous exact public downloads, real prior-version upgrades and cryptographic provenance
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          ACCEPTANCE_HANDOFF: ${{ inputs.acceptance_handoff }}
        run: |
          node scripts/release-orchestration.mjs consume --directory .test-data/release-bundle \
            --handoff "$ACCEPTANCE_HANDOFF" --target "$NATIVE_TARGET" \
            --output-file ".test-data/consumer-results/$NATIVE_TARGET.json"
      - name: Retain every original native-consumer result, failure and explicit limitation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-acceptance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/.test-data/consumer-results/
          if-no-files-found: error
          retention-days: 90
