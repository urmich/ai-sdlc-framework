          name: npm-oidc-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            npm-work/auth-config-evidence.json
            npm-work/npm-publication-result.json
            npm-work/npm-publication-journal.ndjson
            npm-work/publication-dispatch.json
