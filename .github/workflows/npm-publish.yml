name: Protected npm OIDC publication

on:
  workflow_call:
    outputs:
      result_artifact_id:
        value: ${{ jobs.publish.outputs.result_artifact_id }}
      result_artifact_digest:
        value: ${{ jobs.publish.outputs.result_artifact_digest }}
    inputs:
      bundle_artifact_id:
        type: string
        required: true
      bundle_sha256:
        type: string
        required: true
      source_commit:
        type: string
        required: true
      npm_handoff:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      evidence_artifact_id:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      result_artifact_id: ${{ steps.result.outputs.artifact-id }}
      result_artifact_digest: ${{ steps.result.outputs.artifact-digest }}
    # Protection belongs on the actual publishing job, not the reusable caller.
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      NPM_CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      NPM_SOURCE_PRIVATE: ${{ github.event.repository.private }}
      NPM_TRUST_ENVIRONMENT: npm
      NPM_TOOL_VERSION: '11.16.0'
      NPM_TOOL_INTEGRITY: sha512-A74XL8OxmcegZDMWPkWb5bEQppg8HdYwW3rBD2sPoS4UQHVajfaxBkqyzLeJ3wR0kZ+5xoTjItxXaF7eIXUsyw==
      EXPECTED_BUNDLE_ARTIFACT_ID: ${{ inputs.bundle_artifact_id }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      EXPECTED_NPM_HANDOFF: ${{ inputs.npm_handoff }}
    steps:
      # No checkout, repository scripts, application dependency install, or package execution.
      # The only install allowed is an integrity-pinned npm CLI tooling upgrade with scripts disabled.
      # Artifact signing permissions belong in a different job. npm adds OIDC provenance automatically.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Ensure Node 24 and npm 11.15+ with token-free effective auth configuration
        run: |
          node --input-type=module <<'NPM_OIDC_PREFLIGHT'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const env = process.env;
          if (env.GITHUB_ACTIONS !== 'true' || env.RUNNER_ENVIRONMENT !== 'github-hosted' ||
              env.GITHUB_EVENT_NAME !== 'workflow_dispatch' || env.GITHUB_REF !== 'refs/heads/main' ||
              env.GITHUB_REPOSITORY !== 'urmich/ai-sdlc-framework' || env.NPM_SOURCE_PRIVATE !== 'false' ||
              env.NPM_TRUST_ENVIRONMENT !== 'npm' ||
              env.GITHUB_SERVER_URL !== 'https://github.com' ||
              env.GITHUB_WORKFLOW_REF !== env.NPM_CALLER_WORKFLOW_REF ||
              !env.NPM_CALLER_WORKFLOW_REF?.endsWith(`@${env.GITHUB_REF}`) ||
              !/^[1-9]\d*$/u.test(env.GITHUB_RUN_ID ?? '') || !/^[1-9]\d*$/u.test(env.GITHUB_RUN_ATTEMPT ?? '') ||
              !/^[1-9]\d*$/u.test(env.EXPECTED_BUNDLE_ARTIFACT_ID ?? '') ||
              env.NPM_CALLER_WORKFLOW_REF !== 'urmich/ai-sdlc-framework/.github/workflows/release.yml@refs/heads/main' ||
              !/^[a-f0-9]{40}$/u.test(env.EXPECTED_SOURCE_COMMIT ?? '') || env.GITHUB_SHA !== env.EXPECTED_SOURCE_COMMIT ||
              !env.ACTIONS_ID_TOKEN_REQUEST_URL || !env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            throw new Error('npm OIDC requires the public trusted repository, actual release.yml caller, npm environment, exact source and hosted OIDC permissions');
          }
          if (process.versions.node !== '24.22.0') throw new Error('npm publication requires pinned Node.js 24.22.0');
          for (const [key, value] of Object.entries(env)) {
            if (/^(?:node_auth_token|npm_token|npm_auth_token|npm_id_token)$/iu.test(key) ||
                /^npm_config_/iu.test(key) && /auth|token/iu.test(key)) {
              throw new Error('Long-lived or pre-supplied npm authentication is forbidden');
            }
            if (/^npm_config_provenance$/iu.test(key) && value !== 'true') throw new Error('Automatic npm provenance must not be disabled');
          }
          const work = path.join(env.GITHUB_WORKSPACE, 'npm-work');
          await fs.mkdir(work);
          await fs.mkdir(path.join(work, 'home'));
          await fs.mkdir(path.join(work, 'cache'));
          const userConfig = path.join(work, 'user.npmrc');
          const globalConfig = path.join(work, 'global.npmrc');
          await fs.writeFile(userConfig, 'registry=https://registry.npmjs.org/\nignore-scripts=true\n', { flag: 'wx' });
          await fs.writeFile(globalConfig, '', { flag: 'wx' });
          const controlled = { HOME: path.join(work, 'home'), NPM_CONFIG_USERCONFIG: userConfig,
            NPM_CONFIG_GLOBALCONFIG: globalConfig, NPM_CONFIG_CACHE: path.join(work, 'cache'),
            NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org', NPM_CONFIG_IGNORE_SCRIPTS: 'true',
            NPM_CONFIG_UPDATE_NOTIFIER: 'false', NPM_CONFIG_AUDIT: 'false', NPM_CONFIG_FUND: 'false' };
          const clean = Object.fromEntries(Object.entries(env).filter(([key]) => !/^npm_/iu.test(key)));
          const options = { cwd: work, env: { ...clean, ...controlled }, encoding: 'utf8', timeout: 300_000, maxBuffer: 4 * 1024 * 1024 };
          const supported = value => {
            const version = /^(\d+)\.(\d+)\.(\d+)$/u.exec(value);
            return version && (Number(version[1]) > 11 || Number(version[1]) === 11 && Number(version[2]) >= 15);
          };
          const credentialKey = key => /(?:^|:)(?:_auth(?:token)?|_password|username|password|cert(?:file)?|key(?:file)?)$/iu.test(key);
          const assertAuthConfig = (command, prefix = []) => {
            const effective = JSON.parse(execFileSync(command, [...prefix, 'config', 'list', '--json'], options));
            if (Object.entries(effective).some(([key, value]) => credentialKey(key) && value !== null && value !== undefined && value !== '')) {
              throw new Error('Effective npm auth config contains credentials; token-free OIDC compliance cannot pass');
            }
            if (effective.registry !== 'https://registry.npmjs.org' && effective.registry !== 'https://registry.npmjs.org/' ||
                effective['ignore-scripts'] !== true) throw new Error('Effective npm publication configuration is not controlled');
          };
          assertAuthConfig('npm');
          const beforeVersion = execFileSync('npm', ['--version'], options).trim();
          let command = 'npm';
          let prefix = [];
          let upgrade = 'NotNeeded';
          if (beforeVersion !== env.NPM_TOOL_VERSION) {
            if (env.NPM_TOOL_VERSION !== '11.16.0' || !/^sha512-[A-Za-z0-9+/]{86}==$/u.test(env.NPM_TOOL_INTEGRITY ?? '')) {
              throw new Error('Invalid pinned npm tooling upgrade');
            }
            const response = await fetch(`https://registry.npmjs.org/npm/-/npm-${env.NPM_TOOL_VERSION}.tgz`, { signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`npm tooling download failed: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (`sha512-${createHash('sha512').update(bytes).digest('base64')}` !== env.NPM_TOOL_INTEGRITY) {
              throw new Error('Pinned npm tooling integrity mismatch');
            }
            const toolTarball = path.join(work, 'npm-tool.tgz');
            const toolPrefix = path.join(work, 'npm-tool');
            await fs.writeFile(toolTarball, bytes, { flag: 'wx' });
            execFileSync('npm', ['install', '--offline', '--ignore-scripts', '--no-audit', '--no-fund',
              '--bin-links=false', '--prefix', toolPrefix, toolTarball], options);
            command = process.execPath;
            prefix = [path.join(toolPrefix, 'node_modules/npm/bin/npm-cli.js')];
            upgrade = 'IntegrityVerifiedPinnedToolUpgrade';
          }
          const npmVersion = execFileSync(command, [...prefix, '--version'], options).trim();
          if (!supported(npmVersion) || npmVersion !== '11.16.0') {
            throw new Error('Trusted publishing requires pinned npm 11.16.0 after the pinned tool upgrade; token fallback is forbidden');
          }
          assertAuthConfig(command, prefix);
          await fs.writeFile(path.join(work, 'npm-tool.json'), JSON.stringify({ command, prefix, beforeVersion, npmVersion, upgrade }), { flag: 'wx' });
          await fs.writeFile(path.join(work, 'auth-config-evidence.json'), JSON.stringify({
            tokenFree: true, effectiveCredentials: 'Absent', callerFilename: 'release.yml', environment: 'npm',
            npmVersion, upgrade, provenanceMode: 'Automatic public trusted publishing',
          }), { flag: 'wx' });
          await fs.appendFile(env.GITHUB_ENV, Object.entries(controlled).map(([key, value]) => `${key}=${value}\n`).join(''));
          console.log(JSON.stringify({ callerFilename: 'release.yml', calledFilename: 'npm-publish.yml',
            environment: 'npm', node: process.versions.node, npm: npmVersion, upgrade, effectiveAuthConfig: 'TokenFree', authentication: 'OIDC only',
            provenance: 'Automatic for public-repository trusted publishing' }));
          NPM_OIDC_PREFLIGHT
      - name: Independently verify exact saved artifact and read-only verifier origins
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        run: |
          node --input-type=module <<'NPM_ORIGIN_VERIFY'
          const env = process.env;
          const data = JSON.parse(env.EXPECTED_NPM_HANDOFF);
          const origin = data.artifactOrigin;
          const verifier = data.verifierOrigin;
          if (data.schemaVersion !== 2 || origin?.bundleArtifactId !== env.EXPECTED_BUNDLE_ARTIFACT_ID ||
              origin.sourceRunId !== env.SOURCE_RUN_ID || origin.evidenceArtifactId !== env.EVIDENCE_ARTIFACT_ID ||
              verifier?.runId !== env.GITHUB_RUN_ID || verifier.attempt !== env.GITHUB_RUN_ATTEMPT ||
              verifier.workflowRef !== env.GITHUB_WORKFLOW_REF || verifier.job !== 'npm-readiness') {
            throw new Error('Saved artifact/verifier origins do not match this exact trusted caller');
          }
          const get = async route => {
            const response = await fetch(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}${route}`, {
              headers: { Authorization: `Bearer ${env.ARTIFACT_READ_TOKEN}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28' }, signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`Independent publication origin read failed: ${response.status}`);
            return response.json();
          };
          for (const [id, expectedDigest] of [[origin.bundleArtifactId, origin.bundleArtifactDigest],
            [origin.evidenceArtifactId, origin.evidenceArtifactDigest]]) {
            if (!/^[1-9]\d*$/u.test(id ?? '') || !/^sha256:[a-f0-9]{64}$/u.test(expectedDigest ?? '')) {
              throw new Error('Invalid exact saved artifact identity');
            }
            const artifact = await get(`/actions/artifacts/${id}`);
            if (String(artifact.id) !== id || artifact.expired || artifact.digest !== expectedDigest ||
                String(artifact.workflow_run?.id) !== origin.sourceRunId ||
                artifact.workflow_run?.head_sha !== env.EXPECTED_SOURCE_COMMIT) {
              throw new Error('Saved publication artifact differs from independently acquired provider origin');
            }
          }
          const run = await get(`/actions/runs/${verifier.runId}/attempts/${verifier.attempt}`);
          if (run.head_sha !== env.EXPECTED_SOURCE_COMMIT || run.event !== 'workflow_dispatch' ||
              run.path !== '.github/workflows/release.yml') throw new Error('Untrusted verifier workflow/run');
          const jobs = [];
          for (let page = 1; ; page++) {
            const data = await get(`/actions/runs/${verifier.runId}/attempts/${verifier.attempt}/jobs?per_page=100&page=${page}`);
            jobs.push(...data.jobs);
            if (jobs.length >= data.total_count) break;
            if (!data.jobs.length) throw new Error('Incomplete verifier job pagination');
          }
          const matches = jobs.filter(job => job.name === 'npm-readiness');
          if (matches.length !== 1 || matches[0].conclusion !== 'success' ||
              !matches[0].steps?.some(step => step.name === 'Validate readiness and prepare npm identity data without OIDC permission' &&
                step.conclusion === 'success')) throw new Error('Read-only framework readiness verifier did not complete successfully');
          console.log(JSON.stringify({ artifactOrigins: 'Verified', verifierOrigin: 'Verified' }));
          NPM_ORIGIN_VERIFY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.bundle_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: bundle-data
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.evidence_artifact_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: readiness-data
          merge-multiple: true
      - name: Verify immutable data and copy only the exact approved tgz
        run: |
          node --input-type=module <<'NPM_DATA_VERIFY'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const hash = (bytes, algorithm = 'sha256', encoding = 'hex') => createHash(algorithm).update(bytes).digest(encoding);
          const root = path.join(process.env.GITHUB_WORKSPACE, 'bundle-data');
          const work = path.join(process.env.GITHUB_WORKSPACE, 'npm-work');
          const handoff = JSON.parse(process.env.EXPECTED_NPM_HANDOFF);
          if (Object.keys(handoff).sort().join(',') !== 'artifactOrigin,bundleSha256,distTag,filename,integrity,packageName,publicationRecovery,readinessSha256,releaseBinding,releaseIntentId,schemaVersion,sha256,size,sourceCommit,sourceRepository,verifierOrigin,version' ||
              handoff.schemaVersion !== 2 || handoff.sourceRepository !== 'urmich/ai-sdlc-framework' ||
              handoff.sourceCommit !== process.env.EXPECTED_SOURCE_COMMIT || handoff.sourceCommit !== process.env.GITHUB_SHA ||
              handoff.bundleSha256 !== process.env.EXPECTED_BUNDLE_SHA256 ||
              !/^[a-f0-9]{64}$/u.test(handoff.bundleSha256 ?? '') || !/^[a-f0-9]{64}$/u.test(handoff.sha256 ?? '') ||
              handoff.packageName !== 'ai-sdlc-framework' || !Number.isSafeInteger(handoff.size) || handoff.size <= 0) {
            throw new Error('Invalid approved npm handoff identity');
          }
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/u.exec(handoff.version ?? '');
          if (!semver || semver[4]?.split('.').some(value => /^0\d+$/u.test(value)) ||
              handoff.filename !== `${handoff.packageName}-${handoff.version}.tgz` ||
              handoff.distTag !== (semver[4] ? 'next' : 'latest')) throw new Error('Invalid package filename, SemVer or dist-tag');
          async function regular(file, maximum = 128 * 1024 * 1024) {
            const stat = await fs.lstat(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size > maximum) throw new Error('Nonregular or oversized publication data');
            return fs.readFile(file);
          }
          const rootStat = await fs.lstat(root);
          if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) throw new Error('Bundle root must be a literal directory');
          const manifestBytes = await regular(path.join(root, 'bundle.json'), 4 * 1024 * 1024);
          if (hash(manifestBytes) !== handoff.bundleSha256) throw new Error('Immutable bundle manifest digest mismatch');
          const bundle = JSON.parse(manifestBytes);
          if (bundle.schemaVersion !== 1 || bundle.publicationReady !== true ||
              bundle.identity.sourceCommit !== handoff.sourceCommit || bundle.identity.version !== handoff.version ||
              bundle.identity.payloadSha256 !== handoff.sha256 || bundle.releaseIntentId !== handoff.releaseIntentId ||
              !Array.isArray(bundle.files) || !bundle.files.length || bundle.files.length > 10000) {
            throw new Error('Bundle readiness or source identity mismatch');
          }
          if (handoff.releaseBinding?.releaseRepository !== bundle.releaseRepository ||
              handoff.releaseBinding.descriptorSha256 !== bundle.identity.descriptorSha256 ||
              handoff.releaseBinding.checksumsSha256 !== bundle.identity.checksumsSha256) {
            throw new Error('Publication destinations and immutable metadata cannot change across attempts');
          }
          const readinessBytes = await regular(path.join(process.env.GITHUB_WORKSPACE, 'readiness-data', 'readiness.json'), 4 * 1024 * 1024);
          const readiness = JSON.parse(readinessBytes);
          if (hash(readinessBytes) !== handoff.readinessSha256 || readiness.status !== 'Passed' ||
              readiness.profile !== 'r-pre' || readiness.bundleSha256 !== handoff.bundleSha256 ||
              readiness.releaseIntentId !== handoff.releaseIntentId ||
              Object.values(readiness.requiredCases ?? {}).sort().join(',') !==
                'T-PRD079-LX,T-PRD079-MA,T-PRD079-MI,T-PRD079-WX' ||
              readiness.originalExecutions?.length !== 4 ||
              readiness.originalExecutions.some(record => !Number.isFinite(Date.parse(record.finishedAt)) ||
                Date.parse(record.finishedAt) > Date.now() || Date.now() - Date.parse(record.finishedAt) > 86_400_000)) {
            throw new Error('Exact four-native R-PRE readiness handoff is absent or changed');
          }
          const expected = new Map();
          for (const file of bundle.files) {
            if (typeof file.filename !== 'string' || file.filename.startsWith('/') ||
                !/^[A-Za-z0-9_./+-]+$/u.test(file.filename) ||
                file.filename.split('/').some(part => !part || part === '.' || part === '..') ||
                file.filename === 'bundle.json' || expected.has(file.filename.toLowerCase()) ||
                !/^[a-f0-9]{64}$/u.test(file.sha256 ?? '') || !Number.isSafeInteger(file.size) || file.size < 0) {
              throw new Error('Unsafe or duplicate bundle data record');
            }
            expected.set(file.filename.toLowerCase(), file);
          }
          let seen = 0;
          async function inspect(prefix = '') {
            const entries = await fs.readdir(path.join(root, prefix), { withFileTypes: true });
            if (prefix && !entries.length) throw new Error('Unlisted empty bundle directory');
            for (const entry of entries) {
              const relative = prefix ? `${prefix}/${entry.name}` : entry.name;
              if (entry.isDirectory()) await inspect(relative);
              else if (relative !== 'bundle.json') {
                const record = expected.get(relative.toLowerCase());
                if (!record || record.filename !== relative) throw new Error('Unlisted bundle data');
                const bytes = await regular(path.join(root, relative));
                if (bytes.length !== record.size || hash(bytes) !== record.sha256) throw new Error('Bundle file digest mismatch');
                seen++;
              } else if (!entry.isFile()) throw new Error('Bundle manifest is not a regular file');
            }
          }
          await inspect();
          if (seen !== expected.size) throw new Error('Missing bundle data');
          const descriptorBytes = await regular(path.join(root, 'assets/release-descriptor.json'), 4 * 1024 * 1024);
          const checksumBytes = await regular(path.join(root, 'assets/SHA256SUMS'), 4 * 1024 * 1024);
          if (hash(descriptorBytes) !== bundle.identity.descriptorSha256 || hash(checksumBytes) !== bundle.identity.checksumsSha256) {
            throw new Error('Final release metadata changed');
          }
          const descriptor = JSON.parse(descriptorBytes);
          if (descriptor.name !== handoff.packageName || descriptor.version !== handoff.version ||
              descriptor.sourceCommit !== handoff.sourceCommit || descriptor.payload.filename !== handoff.filename ||
              descriptor.payload.sha256 !== handoff.sha256) throw new Error('Release descriptor does not bind the npm payload');
          const source = path.join(root, 'assets', handoff.filename);
          const payload = await regular(source);
          if (payload.length !== handoff.size || hash(payload) !== handoff.sha256 ||
              `sha512-${hash(payload, 'sha512', 'base64')}` !== handoff.integrity) throw new Error('Exact tgz integrity mismatch');
          // Read package metadata to stdout as data only: never extract or import package code.
          const pkg = JSON.parse(execFileSync('tar', ['-xOzf', source, 'package/package.json'],
            { encoding: 'utf8', maxBuffer: 2 * 1024 * 1024, timeout: 30_000 }));
          if (pkg.name !== handoff.packageName || pkg.version !== handoff.version ||
              pkg.repository?.url !== 'https://github.com/urmich/ai-sdlc-framework.git' ||
              Object.keys(pkg.publishConfig ?? {}).sort().join(',') !== 'access,registry' ||
              pkg.publishConfig.access !== 'public' || pkg.publishConfig.registry !== 'https://registry.npmjs.org') {
            throw new Error('Package registry, repository or publication configuration is not approved');
          }
          await fs.writeFile(path.join(work, handoff.filename), payload, { flag: 'wx' });
          await fs.writeFile(path.join(work, 'publication.json'), JSON.stringify(handoff), { flag: 'wx' });
          console.log(JSON.stringify({ verified: true, filename: handoff.filename, sha256: handoff.sha256, sourceCommit: handoff.sourceCommit }));
          NPM_DATA_VERIFY
      - name: Prepare immutable publication dispatch and reconcile-only identity
        working-directory: npm-work
        id: dispatch-record
        run: |
          node --input-type=module <<'NPM_DISPATCH_PREPARE'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const data = JSON.parse(await fs.readFile('publication.json', 'utf8'));
          const canonical = value => value === null || typeof value !== 'object' ? JSON.stringify(value) :
            Array.isArray(value) ? `[${value.map(canonical).join(',')}]` :
            `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;
          const binding = { releaseIntentId: data.releaseIntentId, sourceRepository: data.sourceRepository,
            sourceCommit: data.sourceCommit, releaseRepository: data.releaseBinding?.releaseRepository,
            packageName: data.packageName, version: data.version, payloadSha256: data.sha256,
            descriptorSha256: data.releaseBinding?.descriptorSha256, checksumsSha256: data.releaseBinding?.checksumsSha256,
            registry: 'https://registry.npmjs.org' };
          const history = data.publicationRecovery;
          if (history?.schemaVersion !== 1 || history.kind !== 'npm-publication-recovery' ||
              canonical(history.binding) !== canonical(binding) || !Array.isArray(history.history) || history.history.length > 64) {
            throw new Error('Independently acquired complete publication history is required before dispatch');
          }
          const physicalAttempts = new Set();
          const artifactIds = new Set();
          for (const original of history.history) {
            if (original.schemaVersion !== 1 || original.kind !== 'npm-publication-attempt' ||
                canonical(original.binding) !== canonical(binding) || !['publish', 'reconcile-only'].includes(original.mode) ||
                !/^[1-9]\d*$/u.test(original.run?.id ?? '') || !/^[1-9]\d*$/u.test(original.run?.attempt ?? '') ||
                !/^[1-9]\d*$/u.test(original.dispatchArtifact?.id ?? '') ||
                !/^sha256:[a-f0-9]{64}$/u.test(original.dispatchArtifact?.digest ?? '') ||
                original.invocationRef !== `https://github.com/${binding.sourceRepository}/actions/runs/${original.run.id}/attempts/${original.run.attempt}` ||
                original.priorDispatchArtifacts !== undefined && !Array.isArray(original.priorDispatchArtifacts)) {
              throw new Error('Publication history conflicts with this immutable source/destination/intent');
            }
            const physical = `${original.run.id}/${original.run.attempt}`;
            if (physicalAttempts.has(physical) || artifactIds.has(original.dispatchArtifact.id)) {
              throw new Error('Original physical publication attempts and artifact identities must be distinct');
            }
            physicalAttempts.add(physical);
            artifactIds.add(original.dispatchArtifact.id);
          }
          for (const original of history.history) {
            if (original.mode === 'reconcile-only' && !original.priorDispatchArtifacts?.length) {
              throw new Error('Publication reconciliation cannot forget its original publish root');
            }
            for (const dependency of original.priorDispatchArtifacts ?? []) {
              const root = history.history.find(row => row.dispatchArtifact.id === dependency?.id &&
                row.dispatchArtifact.digest === dependency.digest);
              if (!root || root === original || root.mode !== 'publish' ||
                  !(BigInt(root.run.id) < BigInt(original.run.id) ||
                    root.run.id === original.run.id && BigInt(root.run.attempt) < BigInt(original.run.attempt))) {
                throw new Error('Publication reconciliation cannot forget an unresolved original dispatch');
              }
            }
          }
          const unresolved = history.history.filter(row => row.mode === 'publish' &&
            !['NotStarted', 'RejectedWithoutEffect'].includes(row.confirmedEffect));
          const mayDispatch = unresolved.length === 0;
          if (history.mayDispatch !== mayDispatch) throw new Error('A saved status flag cannot clear an uncertain publication');
          const record = { schemaVersion: 1, kind: 'npm-publication-attempt', binding,
            mode: mayDispatch ? 'publish' : 'reconcile-only', state: mayDispatch ? 'Dispatching' : 'Observing',
            run: { id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT },
