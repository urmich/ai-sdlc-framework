name: PR policy refresh

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      disposable-request:
        description: Exact owner-approved precreated disposable PR/ref/source/rule/writer/app JSON; never production branches
        type: string
        required: true

permissions: {}

concurrency:
  group: framework-readiness-status-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'pull_request_review' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Wake trusted observation without executing contributor code
        run: echo 'The trusted workflow_run observer re-acquires current review and PR facts.'

  probe:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted probe driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Select pinned probe Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          check-latest: false
      - name: Observe explicitly authorized disposable merge-policy failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READINESS_STATUS_CREATOR_ID: ${{ vars.READINESS_STATUS_CREATOR_ID }}
          SDLC_DISPOSABLE_REQUEST: ${{ inputs.disposable-request }}
        run: >-
          node scripts/pr-readiness.mjs probe
          --evidence-dir .test-data/disposable-probe-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain original disposable observations without deleting remote fixtures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disposable-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-data/disposable-probe-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            .test-data/disposable-probe-${{ github.run_id }}-${{ github.run_attempt }}/*.ndjson
          if-no-files-found: warn
          retention-days: 90
