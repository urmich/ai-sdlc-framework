name: Trusted PR readiness

on:
  workflow_run:
    workflows: [CI, PR policy refresh]
    types: [requested, in_progress, completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: framework-readiness-status-writer
  cancel-in-progress: false

defaults:
  run:
    working-directory: source

jobs:
  observe:
    if: github.repository == 'urmich/ai-sdlc-framework'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted observer only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Reconcile all current PR status keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READINESS_STATUS_CREATOR_ID: ${{ vars.READINESS_STATUS_CREATOR_ID }}
          READINESS_PRODUCER_REVISION: ${{ vars.READINESS_PRODUCER_REVISION }}
          READINESS_ARTIFACT_ORIGINS: ${{ vars.READINESS_ARTIFACT_ORIGINS }}
        run: node scripts/pr-observer.mjs
      - name: Retain observer outcomes and explicit gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/.test-data/pr-observer/
          if-no-files-found: error
          retention-days: 90
