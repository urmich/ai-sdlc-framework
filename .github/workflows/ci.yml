name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: source

jobs:
  validate-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use project-local scratch storage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-data/ci-scratch"
          echo "TMPDIR=$GITHUB_WORKSPACE/.test-data/ci-scratch" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm test
      - run: npm run package:artifact
      - run: npm run verify:package
