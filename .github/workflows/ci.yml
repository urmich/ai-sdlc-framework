    timeout-minutes: 360
    env:
      SDLC_TEST_WORKERS: '14'
      SDLC_NATIVE_ROLE: ${{ matrix.role }}
      SDLC_NATIVE_COMPONENT: ${{ matrix.component }}
      SDLC_FRAMEWORK_SHARD: ${{ matrix.shard }}
      NATIVE_TARGET: ${{ matrix.target }}
      GOTOOLCHAIN: local
      SDLC_REPOSITORY_ID: ${{ github.repository_id }}
      SDLC_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SDLC_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || '' }}
      SDLC_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      SDLC_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      SDLC_MERGE_SHA: ${{ github.sha }}
      SDLC_EVENT: ${{ github.event_name }}
    steps:
      - name: Record trusted execution context
        working-directory: ${{ github.workspace }}
        run: |
          node -e 'const e=process.env;console.log("sdlc-run-context:"+JSON.stringify({repositoryId:e.SDLC_REPOSITORY_ID,prNumber:e.SDLC_PR_NUMBER||null,headRepositoryId:e.SDLC_HEAD_REPOSITORY_ID||null,headSha:e.SDLC_HEAD_SHA||null,baseSha:e.SDLC_BASE_SHA||null,mergeSha:e.SDLC_MERGE_SHA,event:e.SDLC_EVENT,runId:e.GITHUB_RUN_ID,attempt:e.GITHUB_RUN_ATTEMPT,ImageOS:e.ImageOS,ImageVersion:e.ImageVersion,platform:process.platform,architecture:process.arch,nativeRole:e.SDLC_NATIVE_ROLE,nativeComponent:e.SDLC_NATIVE_COMPONENT,nativeShard:e.SDLC_FRAMEWORK_SHARD,resources:{availableParallelism:require("node:os").availableParallelism(),totalMemoryBytes:require("node:os").totalmem(),configuredWorkers:e.SDLC_TEST_WORKERS??null}}));'
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: source, ref: '${{ needs.source.outputs.source-commit }}', persist-credentials: false }
      - name: Materialize committed source bytes
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git -c core.autocrlf=false -c core.eol=lf checkout-index --force --all
      - name: Select pinned native Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.20.0', architecture: '${{ matrix.architecture }}', check-latest: false }
      - name: Select pinned native Go
        if: ${{ fromJSON(needs.source.outputs.bootstrap-tools)[matrix.role].go }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version: '1.27.1', check-latest: false, cache: false }
      - name: Select pinned native CPython
        if: ${{ fromJSON(needs.source.outputs.bootstrap-tools)[matrix.role].python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12.10', architecture: '${{ matrix.architecture }}', check-latest: false }
      - name: Provision isolated native toolchain
        id: bootstrap
        run: node scripts/native-toolchain.mjs --target "$NATIVE_TARGET" --output-dir ".test-data/bootstrap-$SDLC_NATIVE_ROLE" --profile pr --component "$SDLC_NATIVE_COMPONENT" --framework-shard "$SDLC_FRAMEWORK_SHARD" --role "$SDLC_NATIVE_ROLE"
      - name: Retain native bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bootstrap-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.test-data/bootstrap-${{ matrix.role }}/*.json
            source/.test-data/bootstrap-${{ matrix.role }}/*.ndjson
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/fixture.json
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/public-intoto.sigstore
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/offline-trust/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retrieve exact frozen candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { artifact-ids: '${{ needs.source.outputs.candidate-artifact-id }}', path: source/.test-data/frozen-candidate, merge-multiple: true }
      - name: Execute native validation
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.source.outputs.source-commit }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.source.outputs.descriptor-sha256 }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.source.outputs.checksums-sha256 }}
        run: >-
          node scripts/native-validation.mjs --target "$NATIVE_TARGET" --profile pr
          --component "$SDLC_NATIVE_COMPONENT" --framework-shard "$SDLC_FRAMEWORK_SHARD"
          --candidate-dir .test-data/frozen-candidate --evidence-dir ".test-data/native-$SDLC_NATIVE_ROLE" --build-candidate false
      - name: Retain native validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.test-data/native-${{ matrix.role }}/*.json
            source/.test-data/native-${{ matrix.role }}/*.ndjson
            source/.test-data/native-${{ matrix.role }}/*.md
            source/.test-data/native-${{ matrix.role }}/tools-*/*.json
            source/.test-data/native-${{ matrix.role }}/tools-*/*.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Remove owned short Homebrew prefix
        if: ${{ always() && runner.os == 'macOS' && steps.bootstrap.outcome != 'skipped' }}
        run: node scripts/native-toolchain.mjs --cleanup --target "$NATIVE_TARGET" --output-dir ".test-data/bootstrap-$SDLC_NATIVE_ROLE"
      - name: Retain native cleanup diagnostics
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cleanup-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.test-data/bootstrap-${{ matrix.role }}/*.json
            source/.test-data/bootstrap-${{ matrix.role }}/*.ndjson
          if-no-files-found: warn
