  producer-summary:
    permissions: {}
    name: Native producer completeness
    if: ${{ always() }}
    needs: [intent, minimum-node, source, native-units, native, native-units-wx, native-wx, native-units-ma, native-ma, native-units-mi, native-mi, native-homebrew, native-mi-refresh, native-homebrew-mi, native-ma-refresh, native-mi-retained, mac-admission, intel-admission, intel-homebrew-admission, intel-retained-admission, arm-refresh-admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report complete producer scheduling
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          UNITS_RESULT: ${{ needs.native-units.result }}
          HOMEBREW_RESULT: ${{ needs.native-homebrew.result }}
          WX_UNITS_RESULT: ${{ needs.native-units-wx.result }}
          WX_NATIVE_RESULT: ${{ needs.native-wx.result }}
          MA_UNITS_RESULT: ${{ needs.native-units-ma.result }}
          MA_NATIVE_RESULT: ${{ needs.native-ma.result }}
          MI_UNITS_RESULT: ${{ needs.native-units-mi.result }}
          MI_NATIVE_RESULT: ${{ needs.native-mi.result }}
          MAC_ADMISSION_RESULT: ${{ needs.mac-admission.result }}
          INTEL_ADMISSION_RESULT: ${{ needs.intel-admission.result }}
          MI_REFRESH_RESULT: ${{ needs.native-mi-refresh.result }}
          MI_HOMEBREW_RESULT: ${{ needs.native-homebrew-mi.result }}
          INTEL_HOMEBREW_ADMISSION_RESULT: ${{ needs.intel-homebrew-admission.result }}
          ARM_REFRESH_RESULT: ${{ needs.native-ma-refresh.result }}
          MI_RETAINED_RESULT: ${{ needs.native-mi-retained.result }}
          INTEL_RETAINED_ADMISSION_RESULT: ${{ needs.intel-retained-admission.result }}
          ARM_REFRESH_ADMISSION_RESULT: ${{ needs.arm-refresh-admission.result }}
          INTENT_RESULT: ${{ needs.intent.result }}
          REQUIRES_NATIVE: ${{ needs.intent.outputs.requires-native }}
        shell: bash
        run: |
          test "$INTENT_RESULT" = success
          results=("$UNITS_RESULT" "$NATIVE_RESULT" "$WX_UNITS_RESULT" "$WX_NATIVE_RESULT"
            "$MA_UNITS_RESULT" "$MA_NATIVE_RESULT" "$MI_UNITS_RESULT" "$MI_NATIVE_RESULT" "$HOMEBREW_RESULT"
            "$MAC_ADMISSION_RESULT" "$INTEL_ADMISSION_RESULT" "$MI_REFRESH_RESULT" "$MI_HOMEBREW_RESULT" "$INTEL_HOMEBREW_ADMISSION_RESULT" "$ARM_REFRESH_RESULT" "$MI_RETAINED_RESULT" "$INTEL_RETAINED_ADMISSION_RESULT" "$ARM_REFRESH_ADMISSION_RESULT")
          if test "$REQUIRES_NATIVE" = false; then
            printf 'Metadata-only edit: native assertions were not executed; this is not native passing evidence.\n'
            test "$SOURCE_RESULT" = skipped
            test "$MINIMUM_NODE_RESULT" = skipped
            for result in "${results[@]}"; do test "$result" = skipped; done
            exit
          fi
          test "$REQUIRES_NATIVE" = true
          test "$MINIMUM_NODE_RESULT" = success
          printf 'Source freeze: %s\nFour logical lanes / twenty-four required native producer parts: %s\n' "$SOURCE_RESULT" "$NATIVE_RESULT"
          printf 'Provider-verified framework/validation is evaluated independently by the trusted observer.\n'
          test "$SOURCE_RESULT" = success
          for result in "${results[@]}"; do test "$result" = success; done
