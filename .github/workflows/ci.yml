        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        env:
          GOTOOLCHAIN: local
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Select pinned native CPython
        if: ${{ fromJSON(needs.source.outputs.bootstrap-tools)[matrix.role].python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.architecture }}
          check-latest: false
      - name: Provision isolated native toolchain
        id: bootstrap
        env:
          GOTOOLCHAIN: local
        run: node scripts/native-toolchain.mjs --target "$NATIVE_TARGET" --output-dir ".test-data/bootstrap-$SDLC_NATIVE_ROLE" --profile pr --component "$SDLC_NATIVE_COMPONENT" --role "$SDLC_NATIVE_ROLE"
      - name: Retain native bootstrap diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bootstrap-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.test-data/bootstrap-${{ matrix.role }}/*.json
            source/.test-data/bootstrap-${{ matrix.role }}/*.ndjson
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/fixture.json
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/public-intoto.sigstore
            source/.test-data/bootstrap-${{ matrix.role }}/crypto-fixture/offline-trust/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retrieve exact frozen candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.source.outputs.candidate-artifact-id }}
          path: source/.test-data/frozen-candidate
          merge-multiple: true
      - name: Execute native validation
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.source.outputs.source-commit }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ needs.source.outputs.descriptor-sha256 }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.source.outputs.checksums-sha256 }}
        run: >-
          node scripts/native-validation.mjs
          --target "$NATIVE_TARGET" --profile pr --component "$SDLC_NATIVE_COMPONENT"
          --candidate-dir .test-data/frozen-candidate
          --evidence-dir ".test-data/native-$SDLC_NATIVE_ROLE"
          --build-candidate false
      - name: Retain native validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.test-data/native-${{ matrix.role }}/*.json
            source/.test-data/native-${{ matrix.role }}/*.ndjson
            source/.test-data/native-${{ matrix.role }}/*.md
            source/.test-data/native-${{ matrix.role }}/tools-*/*.json
            source/.test-data/native-${{ matrix.role }}/tools-*/*.ndjson
          if-no-files-found: warn
          retention-days: 90
      - name: Remove owned short Homebrew prefix
        if: ${{ always() && steps.bootstrap.outcome != 'skipped' }}
        run: >-
          node scripts/native-toolchain.mjs --cleanup
          --target "$NATIVE_TARGET" --output-dir ".test-data/bootstrap-$SDLC_NATIVE_ROLE"
      - name: Retain native cleanup diagnostics
        if: ${{ always() }}
