name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the validated package to npm
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and assets
        run: npm run check
      - name: Run deterministic tests
        run: npm test
      - name: Build reproducible package
        id: package
        run: |
          npm run package:artifact
          node -e "const fs=require('node:fs');const p=require('./package.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'artifact_name='+p.name+'-'+p.version+'\n')"
      - name: Verify isolated installation lifecycle
        run: npm run verify:package
      - name: Retain installable distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download validated distribution
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate-package.outputs.artifact_name }}
          path: dist
      - name: Publish tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" ||
            { echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2; exit 1; }
          if printf '%s' "$PACKAGE_VERSION" | grep -q -- '-'; then
            RELEASE_KIND='--prerelease'
          else
            RELEASE_KIND='--latest'
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes
          if test "$RELEASE_KIND" = '--prerelease'; then
            gh release edit "$GITHUB_REF_NAME" --draft=false \
              --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false \
              --prerelease=false --latest
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    needs: validate-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify npm repository identity
        env:
          EXPECTED_REPOSITORY_URL: https://github.com/${{ github.repository }}.git
        run: |
          node -e "const p=require('./package.json');if(p.repository?.url!==process.env.EXPECTED_REPOSITORY_URL)throw new Error('package.json repository.url must match the publishing repository')"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download validated distribution
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate-package.outputs.artifact_name }}
          path: dist
      - name: Publish public npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if test "$GITHUB_REF_TYPE" = 'tag'; then
            test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" ||
              { echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2; exit 1; }
          fi
          DIST_TAG="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          PROVENANCE_ARGS=()
          if test "$REPOSITORY_PRIVATE" != 'true'; then
            PROVENANCE_ARGS+=(--provenance)
          fi
          npm publish "./dist/${{ needs.validate-package.outputs.artifact_name }}.tgz" \
            --access public --tag "$DIST_TAG" "${PROVENANCE_ARGS[@]}"
          CONSUMER_ROOT="$(mktemp -d)"
          PUBLISHED_HOME="$CONSUMER_ROOT/copilot-home"
          PUBLISHED_CACHE="$CONSUMER_ROOT/npm-cache"
          PUBLISHED_NPMRC="$CONSUMER_ROOT/npmrc"
          mkdir -p "$PUBLISHED_HOME/sdlc/runtime" "$PUBLISHED_CACHE"
          printf 'registry=https://registry.npmjs.org/\n' > "$PUBLISHED_NPMRC"
          printf 'Preserve consumer instructions.\n' \
            > "$PUBLISHED_HOME/copilot-instructions.md"
          printf '{"retained":true}\n' \
            > "$PUBLISHED_HOME/sdlc/runtime/preexisting.json"
          cd "$CONSUMER_ROOT"
          for attempt in 1 2 3 4 5 6; do
            if env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG="$PUBLISHED_NPMRC" \
              NPM_CONFIG_CACHE="$PUBLISHED_CACHE" npm view \
              "ai-sdlc-framework@$PACKAGE_VERSION" version \
              --registry=https://registry.npmjs.org >/dev/null; then
              break
            fi
            test "$attempt" -lt 6 || exit 1
            sleep 10
          done
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG="$PUBLISHED_NPMRC" \
            NPM_CONFIG_CACHE="$PUBLISHED_CACHE" \
            npx --yes --registry=https://registry.npmjs.org \
            --package="ai-sdlc-framework@$PACKAGE_VERSION" \
            sdlc install --home "$PUBLISHED_HOME"
          node "$PUBLISHED_HOME/sdlc/bin/sdlc.mjs" doctor \
            --home "$PUBLISHED_HOME" > doctor.json
          node -e "const r=require('./doctor.json');if(!r.installed||r.frameworkVersion!==process.argv[1]||r.findings.length)process.exit(1)" "$PACKAGE_VERSION"
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG="$PUBLISHED_NPMRC" \
            NPM_CONFIG_CACHE="$PUBLISHED_CACHE" \
            npx --yes --registry=https://registry.npmjs.org \
            --package="ai-sdlc-framework@$PACKAGE_VERSION" \
            sdlc update --home "$PUBLISHED_HOME" > update.json
          node -e "const r=require('./update.json');if(!r.installed||r.changedFiles.length)process.exit(1)"
          node "$PUBLISHED_HOME/sdlc/bin/sdlc.mjs" doctor \
            --home "$PUBLISHED_HOME" > update-doctor.json
          node -e "const r=require('./update-doctor.json');if(!r.installed||r.frameworkVersion!==process.argv[1]||r.findings.length)process.exit(1)" "$PACKAGE_VERSION"
          node "$PUBLISHED_HOME/sdlc/bin/sdlc.mjs" uninstall \
            --home "$PUBLISHED_HOME" > uninstall.json
          node -e "const fs=require('node:fs');const r=require('./uninstall.json');if(!r.uninstalled||r.preserved.length||fs.readFileSync(process.argv[1],'utf8')!=='{\"retained\":true}\\n'||fs.existsSync(process.argv[2])||fs.existsSync(process.argv[3])||!fs.readFileSync(process.argv[4],'utf8').includes('Preserve consumer instructions.'))process.exit(1)" \
            "$PUBLISHED_HOME/sdlc/runtime/preexisting.json" \
            "$PUBLISHED_HOME/sdlc/install-manifest.json" \
            "$PUBLISHED_HOME/hooks/sdlc.json" \
            "$PUBLISHED_HOME/copilot-instructions.md"
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG="$PUBLISHED_NPMRC" \
            NPM_CONFIG_CACHE="$PUBLISHED_CACHE" \
            npx --yes --registry=https://registry.npmjs.org \
            --package="ai-sdlc-framework@$PACKAGE_VERSION" \
            sdlc install --purge-existing --home "$PUBLISHED_HOME"
          node "$PUBLISHED_HOME/sdlc/bin/sdlc.mjs" doctor \
            --home "$PUBLISHED_HOME" > clean-doctor.json
          node -e "const fs=require('node:fs');const r=require('./clean-doctor.json');if(!r.installed||r.frameworkVersion!==process.argv[1]||r.findings.length||fs.existsSync(process.argv[2]))process.exit(1)" \
            "$PACKAGE_VERSION" \
            "$PUBLISHED_HOME/sdlc/runtime/preexisting.json"
          node "$PUBLISHED_HOME/sdlc/bin/sdlc.mjs" uninstall --purge \
            --home "$PUBLISHED_HOME"
          env -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG="$PUBLISHED_NPMRC" \
            NPM_CONFIG_CACHE="$PUBLISHED_CACHE" \
            npx --yes --registry=https://registry.npmjs.org \
            --package="ai-sdlc-framework@$PACKAGE_VERSION" \
            sdlc doctor --home "$PUBLISHED_HOME" > final-doctor.json
          node -e "const fs=require('node:fs');const r=require('./final-doctor.json');if(r.installed||fs.existsSync(process.argv[1])||fs.existsSync(process.argv[2])||fs.existsSync(process.argv[3])||!fs.readFileSync(process.argv[4],'utf8').includes('Preserve consumer instructions.'))process.exit(1)" \
            "$PUBLISHED_HOME/sdlc" "$PUBLISHED_HOME/hooks/sdlc.json" \
            "$PUBLISHED_HOME/skills/sdlc" \
            "$PUBLISHED_HOME/copilot-instructions.md"
